[project]
name = "tastetube"
version = "0.1.0"
description = "Courses and a long-form library from the YouTube videos Hacker News keeps recommending."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tastetube = "tastetube.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tastetube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
