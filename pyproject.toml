[project]
name = "tastetube"
version = "0.1.0"
description = "YouTube videos that Hacker News keeps recommending, ranked for our taste."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "duckdb>=1.1",
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tastetube = "tastetube.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tastetube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
