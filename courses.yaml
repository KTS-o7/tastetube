  - id: building-companies
    title: "Building a company as a technical founder"
    facets: [building]
    mode: easy
    why: "Startup and bootstrapping advice HN keeps returning to, plus how to lead engineers."
    summary: >
      Sam Altman's first How to Start a Startup lecture and Peter Thiel on monopoly set the
      venture view. DHH and Jason Cohen make the case for bootstrapping, and Mike Monteiro on
      getting paid. Then running the company: Ed Catmull on creative culture, Bryan Cantrill on
      technology leadership, Conway's law, and Alan Kay on inventing the future.
    takeaway: "Two clear models for a company (venture and bootstrapped) and how to lead engineers."
    prereqs: "None."
    videos:
      - CBYhVcO4WgI  # How to Start a Startup, Lecture 1 (Sam Altman)
